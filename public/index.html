<!doctype html>
<html>
<head>
  <title>Rakshak – WhatsApp View</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", Helvetica, Arial, sans-serif;
      background: #111b21;
      height: 100vh;
      display: flex;
      color: #e9edef;
    }

    /* ---------- LEFT (DESKTOP) ---------- */
    .left {
      width: 28%;
      background: #111b21;
      border-right: 1px solid #222e35;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    textarea {
      background: #202c33;
      color: #e9edef;
      border: none;
      border-radius: 8px;
      padding: 10px;
      height: 100px;
      resize: none;
      outline: none;
      font-size: 14px;
    }

    button {
      padding: 10px;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
    }

    .send-btn {
      background: #00a884;
      color: #002e25;
      font-weight: 600;
    }

    .info-btn {
      background: #202c33;
      color: #e9edef;
    }

    /* ---------- RIGHT ---------- */
    .right {
      width: 72%;
      display: flex;
      flex-direction: column;
      background: #0b141a;
      position: relative;
    }

    .header {
      height: 59px;
      background: #202c33;
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 12px;
      border-bottom: 1px solid #222e35;
    }

    .hamburger {
      font-size: 22px;
      cursor: pointer;
      display: none;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #6b7280;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #111b21;
    }

    .contact-info {
      display: flex;
      flex-direction: column;
    }

    .contact-name { font-size: 15px; font-weight: 600; }
    .contact-status { font-size: 12px; color: #ff6b6b; }

    .brand {
      margin-left: auto;
      font-weight: 700;
      color: #25d366;
    }

    .chat {
      flex: 1;
      padding: 12px 16px;
      overflow-y: auto;
    }

    .row { display: flex; margin-bottom: 4px; }

    .bubble {
      max-width: 75%;
      padding: 6px 8px;
      font-size: 14px;
      border-radius: 7.5px;
      line-height: 1.4;
    }

    .scammer {
      background: #202c33;
      border-top-left-radius: 0;
    }

    .user, .ai {
      background: #005c4b;
      margin-left: auto;
      border-top-right-radius: 0;
    }

    .input-bar {
      height: 62px;
      background: #202c33;
      display: flex;
      align-items: center;
      padding: 0 10px;
      gap: 10px;
    }

    .input-bar input {
      flex: 1;
      background: #111b21;
      border: none;
      border-radius: 20px;
      padding: 10px 14px;
      color: #e9edef;
      outline: none;
    }
    .input-bar textarea {
  flex: 1;
  background: #111b21;
  border: none;
  border-radius: 18px;
  padding: 10px 14px;
  color: #e9edef;
  outline: none;
  resize: none;
  font-size: 14px;
  line-height: 1.4;
  max-height: 40px;
  overflow-y: auto;
}


    .input-bar button {
      background: #00a884;
      border-radius: 50%;
      width: 36px;
      height: 36px;
    }

    .json-box {
      background: #111b21;
      border-top: 1px solid #222e35;
      max-height: 220px;
      overflow-y: auto;
      display: none;
      padding: 12px;
    }

    pre {
      margin: 0;
      font-size: 12px;
      color: #25d366;
    }

    .locked,
.locked input,
.locked button {
  pointer-events: none;
  opacity: 0.5;
}
@media (max-width: 768px) {
  .input-bar {
    position: relative;
    z-index: 5;
  }

  .mobile-panel {
    z-index: 20;
  }
}


    /* ---------- MOBILE HAMBURGER PANEL ---------- */
    .mobile-panel {
      position: fixed;
      bottom: -100%;
      left: 0;
      right: 0;
      background: #111b21;
      border-top: 1px solid #222e35;
      padding: 14px;
      transition: 0.3s;
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .mobile-panel.show {
      bottom: 0;
    }

    /* ---------- RESPONSIVE ---------- */
    @media (max-width: 768px) {
      .left { display: none; }
      .right { width: 100%; }
      .hamburger { display: block; }
      
    }
  </style>
</head>

<body>

<!-- DESKTOP LEFT -->
<div class="left">
  <textarea id="scammerInput" placeholder="Paste scammer message..."></textarea>
  <button class="send-btn" onclick="sendScammer()">Inject Scammer Msg</button>
  <button class="info-btn" onclick="toggleInfo()">📊 Extracted Info</button>
</div>

<!-- RIGHT -->
<div class="right">
  <div class="header">
    <div class="hamburger" onclick="toggleHamburger()">☰</div>
    <div class="avatar">S</div>
    <div class="contact-info">
      <div class="contact-name">Unknown</div>
      <div class="contact-status" id="modeStatus"></div>
    </div>
    <div class="brand">Rakshak.ai</div>
  </div>

  <div class="chat" id="chat"></div>

  <!-- Desktop input -->
  <div class="input-bar">
  <textarea
    id="userInput"
    placeholder="Type a message"
    rows="1"
  ></textarea>
  <button onclick="sendUser()">➤</button>
</div>


  <div class="json-box" id="jsonBox">
    <pre id="intelligence">{}</pre>
  </div>
</div>

<!-- MOBILE HAMBURGER -->
<div class="mobile-panel" id="mobilePanel">
  <textarea id="mobileScammerInput" placeholder="Paste scammer message..."></textarea>
  <button class="send-btn" onclick="sendScammer(true)">Inject Scammer Msg</button>


  <button class="info-btn" onclick="toggleInfo(true)">📊 Extracted Info</button>
</div>

<script>
  function lockInput() {
  document.querySelector(".input-bar").classList.add("locked");
}

function unlockInput() {
  document.querySelector(".input-bar").classList.remove("locked");
}

  let aiTakeover = false;
  let infoVisible = false;
  const conversationId = crypto.randomUUID();

  function toggleHamburger() {
    document.getElementById("mobilePanel").classList.toggle("show");
  }

  function toggleInfo(fromMobile = false) {
    infoVisible = !infoVisible;
    document.getElementById("jsonBox").style.display =
      infoVisible ? "block" : "none";

    if (fromMobile) toggleHamburger();
  }

  function appendBubble(role, text) {
    const row = document.createElement("div");
    row.className = "row";
    const bubble = document.createElement("div");
    bubble.className = "bubble " + role;
    bubble.textContent = text;
    row.appendChild(bubble);
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
  }

  function sendScammer(fromMobile = false) {
    const input = fromMobile
      ? mobileScammerInput
      : scammerInput;

    const msg = input.value.trim();
    if (!msg) return;

    appendBubble("scammer", msg);
    input.value = "";
    analyze(msg, "scammer");

    if (fromMobile) toggleHamburger();
  }

  function sendUser(fromMobile = false) {
    const input = fromMobile
      ? mobileUserInput
      : userInput;

    const msg = input.value.trim();
    if (!msg) return;

    appendBubble("user", msg);
    input.value = "";
    analyze(msg, "user");

    if (fromMobile) toggleHamburger();
  }
async function typeAIMessage(text, speed = 40) {
  const input = userInput;

  // 👇 MOBILE FIX: close hamburger if open
  const panel = document.getElementById("mobilePanel");
  if (panel && panel.classList.contains("show")) {
    panel.classList.remove("show");
  }

  lockInput();
  input.value = "";

  for (let ch of text) {
    input.value += ch;
    await new Promise(r => setTimeout(r, speed));
  }

  appendBubble("ai", text);
  input.value = "";
}

  async function analyze(message, sender) {
    const typingRow = document.createElement("div");
    typingRow.className = "row";
    typingRow.innerHTML = `<div class="bubble ai">typing…</div>`;
    chat.appendChild(typingRow);

    const res = await fetch("/api/receive-message", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        conversation_id: conversationId,
        sender_id: sender,
        message
      })
    });

    const data = await res.json();
    typingRow.remove();

    if (data.intelligence) {
      intelligence.textContent = JSON.stringify(data.intelligence, null, 2);
    }

    if (data.isScam === true) {
      aiTakeover = true;
      modeStatus.innerText = "Scam Detected • AI Takeover Active";
    }

    // FIRST time scam detected
if (data.isScam === true && data.reply) {
  aiTakeover = true;
  modeStatus.innerText = "Scam Detected • AI Takeover Active";
  await typeAIMessage(data.reply);
  return;
}

// NEXT replies during takeover
if (aiTakeover && data.reply) {
  await typeAIMessage(data.reply);
}

  }
  window.addEventListener("load", () => {
  aiTakeover = false;
  unlockInput();
  modeStatus.innerText = "";
});

</script>

</body>
</html>
