<!doctype html>
<html>
<head>
  <title>Rakshak – WhatsApp View</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", Helvetica, Arial, sans-serif;
      background: #111b21;
      height: 100vh;
      display: flex;
      color: #e9edef;
    }

    /* ---------- LEFT (DESKTOP) ---------- */
    .left {
      width: 28%;
      background: #111b21;
      border-right: 1px solid #222e35;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    textarea {
      background: #202c33;
      color: #e9edef;
      border: none;
      border-radius: 8px;
      padding: 10px;
      height: 120px;
      resize: none;
      outline: none;
      font-size: 14px;
    }

    button {
      padding: 10px;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
    }

    .send-btn {
      background: #00a884;
      color: #002e25;
      font-weight: 600;
    }

    .info-btn {
      background: #202c33;
      color: #e9edef;
      margin-top: auto;
    }

    /* ---------- RIGHT ---------- */
    .right {
      width: 72%;
      display: flex;
      flex-direction: column;
      background: #0b141a;
    }

    .header {
      height: 59px;
      background: #202c33;
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 12px;
      border-bottom: 1px solid #222e35;
    }

    .hamburger {
      font-size: 22px;
      cursor: pointer;
      display: none;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #6b7280;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #111b21;
    }

    .contact-info {
      display: flex;
      flex-direction: column;
    }

    .contact-name { font-size: 15px; font-weight: 600; }
    .contact-status { font-size: 12px; color: #8696a0; }

    .brand {
      margin-left: auto;
      font-weight: 700;
      color: #25d366;
    }

    .chat {
      flex: 1;
      padding: 12px 16px;
      overflow-y: auto;
    }

    .row { display: flex; margin-bottom: 4px; }

    .bubble {
      max-width: 75%;
      padding: 6px 8px;
      font-size: 14px;
      border-radius: 7.5px;
      line-height: 1.4;
    }

    .scammer {
      background: #202c33;
      border-top-left-radius: 0;
    }

    .user, .ai {
      background: #005c4b;
      margin-left: auto;
      border-top-right-radius: 0;
    }

    .input-bar {
      height: 62px;
      background: #202c33;
      display: flex;
      align-items: center;
      padding: 0 10px;
      gap: 10px;
    }

    .input-bar input {
      flex: 1;
      background: #111b21;
      border: none;
      border-radius: 20px;
      padding: 10px 14px;
      color: #e9edef;
      outline: none;
    }

    .input-bar button {
      background: #00a884;
      border-radius: 50%;
      width: 36px;
      height: 36px;
    }

    .json-box {
      background: #111b21;
      border-top: 1px solid #222e35;
      max-height: 200px;
      overflow-y: auto;
      display: none;
      padding: 12px;
    }

    pre {
      font-size: 12px;
      color: #25d366;
      white-space: pre-wrap;
    }

    /* ---------- MOBILE SCAMMER PANEL ---------- */
    .mobile-panel {
      position: fixed;
      bottom: -100%;
      left: 0;
      right: 0;
      background: #111b21;
      border-top: 1px solid #222e35;
      padding: 12px;
      transition: 0.3s;
      z-index: 10;
    }


    .mobile-panel.show { bottom: 0; }

    /* ---------- RESPONSIVE ---------- */
    @media (max-width: 768px) {
      .left { display: none; }
      .right { width: 100%; }
      .hamburger { display: block; }
    }
    .locked {
  pointer-events: none;
  opacity: 0.4;
}
  </style>
</head>

<body>

<!-- LEFT DESKTOP -->
<div class="left">
  <textarea id="scammerInput" placeholder="Paste scammer message..."></textarea>
  <button class="send-btn" onclick="sendScammer()">Inject Scammer Msg</button>
  <button class="info-btn" onclick="toggleInfo()">📊 Extracted Info</button>
</div>

<!-- RIGHT -->
<div class="right">

  <div class="header">
    <div class="hamburger" onclick="togglePanel()">☰</div>
    <div class="avatar">S</div>
    <div class="contact-info">
      <div class="contact-name" id="contactName">Unknown</div>
      <div class="contact-status" id="modeStatus"></div>
    </div>
    <div class="brand">Rakshak.ai</div>
  </div>

  <div class="chat" id="chat"></div>

  <div class="input-bar" id="userBar">
    <input id="userInput" placeholder="Type a message">
    <button onclick="sendUser()">➤</button>
  </div>

  <div class="json-box" id="jsonBox">
    <pre id="intelligence">{}</pre>
  </div>
</div>

<!-- MOBILE PANEL -->
<div class="mobile-panel" id="mobilePanel">
  <textarea id="mobileScammerInput" placeholder="Paste scammer message..."></textarea>
  <button class="send-btn" onclick="sendScammer(true)">Inject</button>
  <button class="info-btn" onclick="toggleInfo(); togglePanel();">📊 Extracted Info</button>
</div>

<script>
  let aiTakeover = false;
  let lastIntel = {};
  let infoVisible = false;

  document.getElementById("userInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendUser();
  });

  function togglePanel() {
    document.getElementById("mobilePanel").classList.toggle("show");
  }

  function appendBubble(role, text) {
    const chat = document.getElementById("chat");
    const row = document.createElement("div");
    row.className = "row";
    const bubble = document.createElement("div");
    bubble.className = "bubble " + role;
    bubble.textContent = text;
    row.appendChild(bubble);
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
  }

  function toggleInfo() {
    infoVisible = !infoVisible;
    document.getElementById("jsonBox").style.display =
      infoVisible ? "block" : "none";
  }

  async function typeInInput(text, speed = 50) {
    const input = document.getElementById("userInput");
    const bar = document.getElementById("userBar");

    bar.classList.remove("locked");
    input.value = "";
    document.getElementById("modeStatus").innerText =
      "Scam Detected • AI Takeover Active";

    for (let ch of text) {
      input.value += ch;
      await new Promise((r) => setTimeout(r, speed));
    }

    bar.classList.add("locked");
  }

  function sendScammer(fromMobile = false) {
    const input = fromMobile
      ? document.getElementById("mobileScammerInput")
      : document.getElementById("scammerInput");

    const msg = input.value.trim();
    if (!msg) return;

    appendBubble("scammer", msg);
    input.value = "";
    document.getElementById("contactName").innerText = "Unknown";

    analyze(msg);
    if (fromMobile) togglePanel();
  }

  function sendUser() {
    if (aiTakeover) return;

    const input = document.getElementById("userInput");
    const msg = input.value.trim();
    if (!msg) return;

    appendBubble("user", msg);
    input.value = "";

    analyze(msg);
  }

  async function analyze(message) {
    const chat = document.getElementById("chat");

    const typingRow = document.createElement("div");
    typingRow.className = "row";
    const typingBubble = document.createElement("div");
    typingBubble.className = "bubble ai";
    typingBubble.textContent = "typing…";
    typingRow.appendChild(typingBubble);
    chat.appendChild(typingRow);
    chat.scrollTop = chat.scrollHeight;

    try {
      const res = await fetch("/api/receive-message", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          conversation_id: "honeypot",
          sender_id: "scammer",
          message,
        }),
      });

      const data = await res.json();
      typingRow.remove();

      if (data.intelligence) {
        lastIntel = { ...lastIntel, ...data.intelligence };
        document.getElementById("intelligence").textContent =
          JSON.stringify(lastIntel, null, 2);
      }

      if (data.reply) {
        aiTakeover = true;
        document.getElementById("userBar").classList.add("locked");
        await typeInInput(data.reply);
        appendBubble("ai", data.reply);
        document.getElementById("userInput").value = "";
      }
    } catch (err) {
      typingRow.remove();
      console.error("API error:", err);
    }
  }
</script>

</body>
</html>
